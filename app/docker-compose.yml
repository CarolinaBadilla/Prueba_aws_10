version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: local-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: enterprise_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: local-backend
    restart: always
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: secretpassword
      DB_NAME: enterprise_db
      DB_PORT: 5432
    depends_on:
      - db
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: local-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata: