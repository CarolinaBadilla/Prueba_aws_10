apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enterprise-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/CarolinaBadilla/Prueba_aws_10.git'
    targetRevision: main
    path: k8s/base
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: enterprise-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
