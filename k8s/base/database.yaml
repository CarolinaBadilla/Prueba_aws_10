apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: enterprise-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "EnterpriseSecurePass2026!"
            - name: POSTGRES_DB
              value: "enterprise_db"
          volumeMounts:
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
      volumes:
        - name: init-script
          configMap:
            name: postgres-init-script