apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: enterprise-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      containers:
        - name: frontend
          image: 512902043510.dkr.ecr.us-east-1.amazonaws.com/enterprise-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "30m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          # Montaje del ConfigMap sobre default.conf
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: enterprise-apps
spec:
  type: ClusterIP
  selector:
    app: frontend-app
  ports:
    - port: 80
      targetPort: 80